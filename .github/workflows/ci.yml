name: ci

on:
  pull_request:
    branches: [develop, main, "release/**"]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @how-about-me/api prisma:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: how_about_me_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/how_about_me_test?schema=public
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/how_about_me_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/how_about_me_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @how-about-me/api prisma:generate
      - run: pnpm --filter @how-about-me/api db:deploy
      # Migrations vs schema.prisma must not drift (04-data-model, T-007). Shadow DB lives on the same service.
      - name: Prisma migration drift
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/how_about_me_shadow?schema=public
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE how_about_me_shadow"
          pnpm --filter @how-about-me/api db:drift
      - run: pnpm test:cov
      - name: API integration tests
        run: pnpm test:int
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: "**/coverage/**/lcov.info", if-no-files-found: warn }

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @how-about-me/api prisma:generate
      - run: pnpm build
      # --build-env: fail if any server-only secret is present in the web build env (08-security-secrets §9).
      - run: pnpm check:fe-secrets --build-env

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+, allowlist)
        run: pnpm audit:check
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
