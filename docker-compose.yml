services:
  postgres:
    image: postgres:16-alpine
    container_name: how-about-me-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: how_about_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d how_about_me"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
